name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-merge patch & minor
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Approve and enable auto-merge for patch/minor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          echo "PR: ${PR_URL}"
          echo "Labels: ${PR_LABELS}"

          # Only auto-merge when the PR is labeled as automated dependency update.
          if echo "${PR_LABELS}" | grep -q "automated"; then
            echo "Enabling auto-merge (squash)..."
            gh pr merge --auto --squash "${PR_URL}"
          else
            echo "No 'automated' label — skipping auto-merge."
          fi