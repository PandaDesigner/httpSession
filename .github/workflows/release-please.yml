name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          package-name: http-session-core

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' && (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') }}
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: ./package.json

      - name: Skip publish — NPM_TOKEN not configured
        if: ${{ secrets.NPM_TOKEN == '' && (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') }}
        run: |
          echo "::warning::NPM_TOKEN secret is not configured in this repo."
          echo "::warning::The GitHub Release and tag were created, but the npm publish step was skipped."
          echo "::warning::To finish publishing, run \`npm publish --access public\` from your local checkout."